<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="description" content="Plataforma de operación en campo y administración para las rutas de recolección de Ruta Cero.">
  <title>Ruta Cero • Operaciones</title>
  
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
  <meta name="apple-mobile-web-app-title" content="Ruta Cero">

  <!-- Barlow Condensed, Atkinson Hyperlegible Next, JetBrains Mono and Material Symbols,
       bundled with the app so the APK shows text and icons without a connection -->
  <link rel="stylesheet" href="/src/styles/fonts.css">

  <!-- Global stylesheets; each mode loads its own sheet from src/main.js -->
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="hud-body">
  <!-- Splash shown until src/main.js mounts a screen; same markup as renderAdminDashboard() -->
  <div id="app">
    <div class="app-splash" role="status">
      <img src="/logo-light.svg" alt="Ruta Cero">
      <span class="app-splash-spinner" aria-hidden="true"></span>
      <span class="app-splash-label">Cargando…</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
