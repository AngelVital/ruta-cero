<!-- JAVASCRIPT DE INTERACTIVIDAD -->
<script>
  (function () {
    const TANK_CAPACITY = 250;
    let currentLevel = 85;

    const levelDisplay = document.getElementById('level-percentage');
    const statusDisplay = document.getElementById('level-status');
    const litersDisplay = document.getElementById('liters-calculated');
    const segmentElements = document.querySelectorAll('.tank-segment');
    const quickButtons = document.querySelectorAll('.quick-btn');
    const btnStepDown = document.getElementById('btn-step-down');
    const btnStepUp = document.getElementById('btn-step-up');
    const btnConfirm = document.getElementById('btn-confirm-save');

    function getStatusLabel(level) {
      if (level <= 15) return 'CRÍTICO';
      if (level <= 30) return 'RESERVA';
      if (level <= 60) return '1/2 MEDIO';
      if (level <= 80) return '3/4 TANQUE';
      if (level < 100) return '85% ACTUAL';
      return 'LLENO';
    }

    function updateFuelLevel(newLevel, explicitStatus = null) {
      currentLevel = Math.max(0, Math.min(100, Math.round(newLevel)));
      const liters = ((currentLevel / 100) * TANK_CAPACITY).toFixed(1);

      // 1. Actualizar texto de nivel y litros
      if (levelDisplay) {
        levelDisplay.textContent = `${currentLevel}%`;
      }
      if (statusDisplay) {
        statusDisplay.textContent = explicitStatus || getStatusLabel(currentLevel);
        if (currentLevel <= 15) {
          statusDisplay.className = 'font-headline-sm text-headline-sm text-error font-bold tracking-wide';
        } else {
          statusDisplay.className = 'font-headline-sm text-headline-sm text-primary font-bold tracking-wide';
        }
      }
      if (litersDisplay) {
        litersDisplay.textContent = `${liters} L ESTIMADOS`;
      }

      // 2. Actualizar visualmente la barra técnica segmentada
      segmentElements.forEach((segment) => {
        const threshold = parseInt(segment.getAttribute('data-threshold'), 10);
        const spanText = segment.querySelector('span');
        let pulseEl = segment.querySelector('.segment-pulse');

        if (currentLevel >= threshold) {
          // Bloque activo / lleno
          segment.classList.remove('bg-surface-container-high', 'border-outline', 'opacity-60');
          segment.classList.add('bg-primary', 'border-on-surface');
          if (spanText) {
            spanText.classList.remove('text-on-surface-variant');
            spanText.classList.add('text-on-primary');
          }
          if (pulseEl) {
            pulseEl.classList.remove('hidden');
          }
        } else {
          // Bloque vacío / atenuado
          segment.classList.add('bg-surface-container-high', 'border-outline', 'opacity-60');
          segment.classList.remove('bg-primary', 'border-on-surface');
          if (spanText) {
            spanText.classList.add('text-on-surface-variant');
            spanText.classList.remove('text-on-primary');
          }
          if (pulseEl) {
            pulseEl.classList.add('hidden');
          }
        }
      });

      // 3. Actualizar estado visual de los botones de selección rápida
      quickButtons.forEach((btn) => {
        const btnLevel = parseInt(btn.getAttribute('data-level'), 10);
        const titleEl = btn.querySelector('.btn-title');
        const subEl = btn.querySelector('.btn-sub');
        const checkEl = btn.querySelector('.btn-check');

        if (btnLevel === currentLevel) {
          // Activar botón seleccionado
          btn.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'hud-press');
          btn.classList.add('bg-primary', 'text-on-primary', 'hud-shadow-solid-sm');

          if (titleEl) {
            titleEl.classList.remove('text-error', 'text-on-surface');
            titleEl.classList.add('text-on-primary');
          }
          if (subEl) {
            subEl.classList.remove('text-secondary');
            subEl.classList.add('text-surface-bright', 'font-bold');
          }
          if (checkEl) {
            checkEl.classList.remove('hidden');
            checkEl.classList.add('inline-block', 'text-on-primary');
          }
        } else {
          // Desactivar botón
          btn.classList.remove('bg-primary', 'text-on-primary', 'hud-shadow-solid-sm');
          btn.classList.add('bg-surface-container-lowest', 'hud-press');

          if (titleEl) {
            titleEl.classList.remove('text-on-primary');
            if (btnLevel <= 15) {
              titleEl.classList.add('text-error');
            } else {
              titleEl.classList.add('text-on-surface');
            }
          }
          if (subEl) {
            subEl.classList.remove('text-surface-bright', 'font-bold');
            subEl.classList.add('text-secondary');
          }
          if (checkEl) {
            checkEl.classList.remove('inline-block');
            checkEl.classList.add('hidden');
          }
        }
      });
    }

    // Listeners para botones rápidos
    quickButtons.forEach((btn) => {
      btn.addEventListener('click', function () {
        const level = parseInt(this.getAttribute('data-level'), 10);
        const status = this.getAttribute('data-status');
        updateFuelLevel(level, status);
      });
    });

    // Listeners de ajuste fino [-5%] y [+5%]
    if (btnStepDown) {
      btnStepDown.addEventListener('click', function () {
        updateFuelLevel(currentLevel - 5);
      });
    }

    if (btnStepUp) {
      btnStepUp.addEventListener('click', function () {
        updateFuelLevel(currentLevel + 5);
      });
    }

    // Feedback visual al presionar Confirmar y Actualizar
    if (btnConfirm) {
      btnConfirm.addEventListener('click', function () {
        const originalText = this.innerHTML;
        this.innerHTML = '<span class="material-symbols-outlined text-[26px]">task_alt</span> <span>¡ACTUALIZADO CON ÉXITO!</span>';
        this.classList.add('bg-primary');
        setTimeout(() => {
          this.innerHTML = originalText;
          this.classList.remove('bg-primary');
        }, 1800);
      });
    }

    // Inicializar con el valor activo (85%)
    updateFuelLevel(85, '85% ACTUAL');
  })();
</script>
</body></html>
